name: GitHub Secret Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify demo secret is configured
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN_MISSING }}
        shell: bash
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "Required secret DEMO_API_TOKEN is missing."
            exit 1
          fi
          echo "Secret is present and was injected into this step."
          echo "The secret value will not be printed."
